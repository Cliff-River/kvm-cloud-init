# kvm-cloud-init 全局默认值（YAML）
# 优先级：instances.conf > templates.conf > 本文件。
# 所有相对路径均相对于项目根目录（本文件所在目录）。

# libvirt 存储池；镜像与 cidata.iso 会上传到该池
storage_pool: default

# 源 qcow2 镜像所在目录（模板的 image_dir 缺省时取此值）
image_dir: images

# 虚拟机默认资源（模板/实例可覆盖）
memory: 2048        # MiB
vcpus: 4

# libvirt 网络名（virtio 网卡接入此网络）
network: default

# 固件策略：auto（检测到 OVMF 用 UEFI，否则回退 BIOS）| uefi | bios
firmware: auto

# 图形控制台：vnc（自动选端口）| spice | none（无图形，仅串口控制台）
graphics: spice
# 虚拟显卡型号：auto（不写 video 元素，用 libvirt/qemu 默认）| virtio | bochs | cirrus | qxl
video: virtio

# 删除保护级别：normal（可直接删除/重建）| production（destroy 或 create 重建
# 同名实例前需交互输入 yes，可加 --yes 跳过；create 还可用 --force）|
# protected（直接拒绝删除/重建，--yes/--force 均无效，只能改配置解除）。
# 此处刻意不写 level：缺省即 normal；templates.conf / instances.conf 可覆盖。
# level: normal

# destroy 时优雅关机的最长等待秒数，超时后可加 --force 强制关机
shutdown_timeout: 120
