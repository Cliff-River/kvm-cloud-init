# 用户自定义云镜像源（YAML）
#
# 本文件由用户维护，kvmci 只读取、永不改写。与系统生成的 images.conf 合并：
#   - 新增条目：任意 ID，templates.conf 的 image 字段可直接引用；
#   - 同名条目：整体覆盖系统定义（不做字段级深合并），list 的 Origin 显示
#     user(override)。
#
# 顶层每个键即镜像 ID，条目字段：
#   file            下载后保存到 image_dir 的固定文件名（必填，须为纯文件名）
#   kind            url（固定直链）| index（目录页爬虫，按版本/日期取最新）
#   urls            kind url：1~N 个有序候选直链
#   pages           kind index：1~N 个有序目录页地址
#   match           kind index：匹配 href 文件名的正则
#   order_by        name（默认）| mtime（按 Last-Modified 取最新）
#   checksum_url    kind url：校验清单直链
#   checksum_file   kind index：目录页内的校验清单文件名
#   checksum_match  kind index：校验清单文件名的正则（清单名带版本时使用）
#   checksum_algo   sha256（默认）| sha512
#   format          本地落盘格式 qcow2 | raw；留空则按文件内容自动识别，
#                   识别结果不一致时自动转换到声明格式（raw -> qcow2）
#   insecure        true 时允许无校验和下载；默认 false
#   archived        true 表示 EOL，check 默认跳过
#   arch            仅展示用，默认 x86_64
#
# 发布物可以是 .qcow2/.img/.raw，也可以是单文件压缩包
# （.tar.xz/.tar.gz/.tar.bz2/.tgz/.tar/.zip），下载后自动解压。
#
# 注意：不要再包一层 images: 包装键；"images" 是保留名。

# 示例：内部 HTTP 目录（文件名稳定、带 CHECKSUM）
# 取消注释并把 ID 写进 templates.conf 的 image 字段即可使用。
#
# my-internal:
#   file: my-internal-1.0.qcow2
#   kind: url
#   urls:
#     - http://mirror.example.internal/images/my-internal-1.0.qcow2
#   checksum_url: http://mirror.example.internal/images/my-internal-1.0.qcow2.sha256

# 示例：覆盖系统条目（例如给 almalinux-10 增加国内镜像回退）
#
# almalinux-10:
#   file: AlmaLinux-10-GenericCloud.x86_64.qcow2
#   kind: url
#   urls:
#     - https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
#     - https://mirrors.ustc.edu.cn/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
#   checksum_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2.CHECKSUM
