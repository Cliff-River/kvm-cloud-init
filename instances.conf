# 实例定义（YAML）
#
# 顶层每个键即实例名，也是 libvirt domain 名（同一 libvirt 连接内唯一）。
# 每个实例通过 template 引用 templates.conf 中的模板，并可在创建前覆盖配置。
# 注意：不要再包一层 instances: 包装键；"instances" 是保留名。
# 可覆盖字段：
#   template    模板名（必填）
#   memory      内存 MiB
#   vcpus       vCPU 数
#   capacity    磁盘目标大小，如 100G（覆盖模板值；不扩容可省略）
#   graphics    图形控制台：vnc | spice | none（覆盖默认值；none 为无图形仅串口）
#   video       虚拟显卡：auto | virtio | bochs | cirrus | qxl（覆盖默认值）
#   meta-data / network-config / user-data
#               整块替换对应的 cloud-init 文档（不做 YAML 深合并）
# 合并优先级：实例覆盖 > 模板定义 > default.conf 默认值。

rocky-lvm:
  template: Rocky-LVM

# 覆盖示例：
# rocky-dev:
#   template: Rocky-LVM
#   memory: 8192
#   vcpus: 4
#   capacity: 100G
#   user-data: |
