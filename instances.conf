# 实例定义（YAML）
#
# 键即实例名，也是 libvirt domain 名（同一 libvirt 连接内唯一）。
# 每个实例通过 template 引用 templates.conf 中的模板，并可在创建前覆盖配置。
# 可覆盖字段：
#   template    模板名（必填）
#   memory      内存 MiB
#   vcpus       vCPU 数
#   capacity    磁盘目标大小，如 100G（覆盖模板值；不扩容可省略）
#   meta-data / network-config / user-data
#               整块替换对应的 cloud-init 文档（不做 YAML 深合并）
# 合并优先级：实例覆盖 > 模板定义 > default.conf 默认值。

instances:
  rocky-lvm:
    template: Rocky-LVM

  # 覆盖示例：
  # rocky-dev:
  #   template: Rocky-LLM
  #   memory: 8192
  #   vcpus: 4
  #   capacity: 100G
  #   user-data: |
  #     #cloud-config
  #     ssh_pwauth: true
  #     users:
  #       - name: cliff
  #         groups: sudo
  #         sudo: ALL=(ALL) NOPASSWD:ALL
  #
