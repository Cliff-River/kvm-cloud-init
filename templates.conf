# OS 模板定义（YAML）
#
# 顶层每个键即一个模板名，结构由原 template.conf 的 Rocky-LLM 条目演进而来：
#   [Rocky-LLM]           -> 模板名
#   template-path = ...   -> path       （cloud-init 模板目录）
#   images-path = images/ -> image_dir  （源镜像目录）
#   image-name = ...      -> image      （qcow2 文件名）
# 后续新增模板在同一结构上扩展，不要另起结构。
# 注意：不要再包一层 templates: 包装键；"templates" 是保留名。
#
# 每个模板支持的字段：
#   path          cloud-init 模板目录，内含 meta-data / network-config / user-data
#   image_dir     源镜像目录（可省略，缺省取 default.conf 的 image_dir）
#   image         源 qcow2 文件名（必填）
#   os_variant    libosinfo 系统变体 ID，如 rocky10 / ubuntu26.04 / debian13 / almalinux10
#   memory        内存 MiB（可省略，取默认值）
#   vcpus         vCPU 数（可省略，取默认值）
#   capacity      磁盘目标大小，如 100G（可省略，缺省保持镜像原始大小）
#   graphics      图形控制台：vnc | spice | none（可省略，取 default.conf）
#   video         虚拟显卡：auto | virtio | bochs | cirrus | qxl（可省略，取 default.conf）
#   level         删除保护级别：normal | production | protected（可省略，取 default.conf；
#                 适合把某类 OS 镜像整体设为 production/protected）
#   meta-data / network-config / user-data
#                 内联 cloud-init 内容，按文件粒度覆盖 path 目录中的同名文件
#                 （整块替换；未内联的文件仍从 path 目录读取）

Rocky-LVM:
  path: templates/Rocky-LVM
  image_dir: images/
  image: Rocky-10-GenericCloud-LVM-10.2-20260525.0.x86_64.qcow2
  os_variant: rocky10

Ubuntu:
  path: templates/Ubuntu
  image_dir: images/
  image: ubuntu-26.04-server-cloudimg-amd64v3.qcow2
  os_variant: ubuntu26.04

Debian:
  path: templates/Debian
  image_dir: images/
  image: debian-13-generic-amd64-20260831-2587.qcow2
  os_variant: debian13

AlmaLinux:
  path: templates/AlmaLinux
  image_dir: images/
  image: AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
  os_variant: almalinux10
